[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-rwkv7"
version = "0.1.0a0"
description = "Clean-room RWKV-7 model plugin for vLLM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "btlqql", email = "2977859784@qq.com" },
]
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "vllm>=0.11.1",
]

[project.optional-dependencies]
fla = [
  "flash-linear-attention>=0.3.1",
]
test = [
  "pytest>=8",
  "ruff>=0.9",
  "tomli>=2; python_version < '3.11'",
]

[project.entry-points."vllm.general_plugins"]
rwkv7 = "vllm_rwkv7.plugin:register"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires the pinned Linux vLLM runtime",
  "gpu: requires a compatible GPU runtime",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
